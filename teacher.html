<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard — Word Scoop</title><link rel="stylesheet" href="style.css?v=20260829h"></head><body><header><div class="wrap"><span class="brand">WORD SCOOP</span><h1>Teacher Dashboard</h1><p>Local progress stored on this browser</p></div></header><main><nav class="nav"><a href="index.html">Back to Themes</a></nav><section class="teacher-tools"><label><b>Student</b> <select id="studentSelect"></select></label><button class="btn" id="newStudent">Add Student</button><button class="btn" id="deleteStudent">Delete Student</button></section><section class="dashboard"><div class="stat">Themes attempted<b id="tAttempted">0</b></div><div class="stat">Average score<b id="tAverage">0%</b></div><div class="stat">Mastered words<b id="tMastered">0</b></div><div class="stat">Wrong words<b id="tWrong">0</b></div></section><section class="teacher-panel"><h2>Theme Performance</h2><div class="tablewrap"><table><thead><tr><th>Theme</th><th>Best</th><th>Last</th><th>Status</th><th>Last practised</th></tr></thead><tbody id="themeRows"></tbody></table></div></section><section class="teacher-panel"><h2>Words Needing Revision</h2><div id="wrongWords" class="wronglist"></div></section><section class="teacher-panel"><h2>Recent Attempts</h2><div class="tablewrap"><table><thead><tr><th>Theme</th><th>Score</th><th>Mode</th><th>Date</th></tr></thead><tbody id="attemptRows"></tbody></table></div></section></main><script>const KEY='wordscoop_v3',titles=['','Countries & Nationalities','Hobbies & Activities','School Subjects','Weekly Activities & School Life','Chores','Ancient Egypt','Celebrations & Festivals','Occupations','Food','Drinks','Tableware','Transport','Road Safety','Travel','Camping','Recycling & Materials','Animals','Animal Body Parts','Baby Animals','Animal Diets','Sports','Sports Equipment & Competitions','Health Problems','Safety & Health Care'];function blank(){return {themes:{},wrong:{},mastery:{},attempts:[]}}function load(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}return d||{active:'Student',profiles:{Student:blank()}}}function save(d){localStorage.setItem(KEY,JSON.stringify(d))}function fillSelect(){let d=load();studentSelect.innerHTML=Object.keys(d.profiles).map(n=>`<option ${n===d.active?'selected':''}>${n}</option>`).join('')}function render(){let d=load(),name=studentSelect.value||d.active,p=d.profiles[name]||blank();let attempted=0,total=0;themeRows.innerHTML='';for(let i=1;i<=24;i++){let x=p.themes[i]||{};if(x.best!==undefined){attempted++;total+=x.best}let st=x.best===8?'Mastered':x.best>=6?'Strong':x.best>=4?'Developing':'Not completed';themeRows.innerHTML+=`<tr><td>${i}. ${titles[i]}</td><td>${x.best===undefined?'—':x.best+'/8'}</td><td>${x.last===undefined?'—':x.last+'/8'}</td><td>${st}</td><td>${x.date?new Date(x.date).toLocaleString():'—'}</td></tr>`}tAttempted.textContent=attempted+'/24';tAverage.textContent=(attempted?Math.round(total/attempted/8*100):0)+'%';tMastered.textContent=Object.values(p.mastery||{}).filter(x=>(x.score||0)>=4).length;tWrong.textContent=Object.keys(p.wrong||{}).length;wrongWords.innerHTML=Object.values(p.wrong||{}).length?Object.values(p.wrong).map(x=>`<span class="wrongchip">T${x.theme} · ${x.word} · ${x.streak||0}/2</span>`).join(''):'No wrong words.';attemptRows.innerHTML=(p.attempts||[]).slice(0,30).map(a=>`<tr><td>${a.theme}</td><td>${a.score}/8</td><td>${a.mode}</td><td>${new Date(a.date).toLocaleString()}</td></tr>`).join('')}studentSelect.onchange=()=>{let d=load();d.active=studentSelect.value;save(d);render()};newStudent.onclick=()=>{let d=load(),n=prompt('New student name:');if(!n)return;n=n.trim();if(!n)return;d.profiles[n]=d.profiles[n]||blank();d.active=n;save(d);fillSelect();render()};deleteStudent.onclick=()=>{let d=load(),n=studentSelect.value;if(Object.keys(d.profiles).length<=1)return alert('Keep at least one student profile.');if(!confirm('Delete '+n+' and all local progress?'))return;delete d.profiles[n];d.active=Object.keys(d.profiles)[0];save(d);fillSelect();render()};fillSelect();render();</script></body></html>
