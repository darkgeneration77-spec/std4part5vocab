<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkpoint Review — Word Scoop</title><link rel="stylesheet" href="style.css?v=20260829j"><link rel="stylesheet" href="checkpoint.css?v=20260829j"></head><body><header><div class="wrap"><span class="brand">WORD SCOOP</span><h1 id="pageTitle">Checkpoint Review</h1><p id="pageSub"></p></div></header><main><nav class="nav"><a href="index.html">All Themes</a></nav><section class="checkpoint-card"><div class="checkpoint-head"><div><b id="studentName"></b><h2 id="rangeTitle"></h2></div><div class="badge-big" id="badgeBox">LOCKED</div></div><p id="unlockText"></p><div class="dashboard"><div class="stat">Best review score<b id="bestScore">—</b></div><div class="stat">Themes ready<b id="readyCount">0 / 6</b></div><div class="stat">Words in pool<b>48</b></div><div class="stat">Review questions<b>12</b></div></div><button class="btn" id="startBtn">Start Review</button><div id="reviewArea"></div></section></main><div class="toast"></div><button class="btn sound" id="sound">Sound: ON</button><script>const KEY='wordscoop_v3',params=new URLSearchParams(location.search),stage=Math.min(4,Math.max(1,Number(params.get('stage')||1)));const start=(stage-1)*6+1,end=start+5;let soundOn=true,ac=null,pool=[],questions=[],idx=0,score=0;function load(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}return d||{active:'Student',profiles:{Student:{themes:{},wrong:{},mastery:{},attempts:[]}}}}function save(d){localStorage.setItem(KEY,JSON.stringify(d))}function norm(s){return(s||'').trim().toLowerCase().replace(/\s+/g,' ')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function tone(f,d=.13,z=0){if(!soundOn)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!ac)ac=new A();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.13;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+z);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+z+d);o.stop(ac.currentTime+z+d+.02)}function good(){tone(523);tone(659,.14,.08);tone(784,.17,.16)}function bad(){tone(220);tone(196,.17,.1)}function toast(t,e=false){let x=document.querySelector('.toast');x.textContent=t;x.className='toast'+(e?' err':'');void x.offsetWidth;x.classList.add('show')}function confetti(){let cols=['#ffc928','#f59b23','#f3c4c7','#cfe8cf','#7a4a2e'];for(let i=0;i<28;i++){let p=document.createElement('i');p.className='piece';p.style.left=(45+Math.random()*10)+'vw';p.style.top='22vh';p.style.background=cols[i%cols.length];p.style.setProperty('--x',(Math.random()*320-160)+'px');p.style.setProperty('--y',(140+Math.random()*240)+'px');p.style.setProperty('--r',(Math.random()*720-360)+'deg');document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}}async function getTheme(n){let txt=await fetch(`data-${String(n).padStart(2,'0')}.js?v=20260829j`).then(r=>r.text()),box={};new Function('window',txt)(box);return box.THEME}async function init(){let d=load(),p=d.profiles[d.active]||{};studentName.textContent='Student: '+d.active;pageTitle.textContent=`Checkpoint ${stage}`;pageSub.textContent=`Themes ${start}–${end}`;rangeTitle.textContent=`Themes ${start}–${end} Review`;let ready=0;for(let i=start;i<=end;i++)if((p.themes?.[i]?.best||0)>=6)ready++;readyCount.textContent=ready+' / 6';p.reviews=p.reviews||{};bestScore.textContent=p.reviews[stage]?.best===undefined?'—':p.reviews[stage].best+'/12';let unlocked=ready===6;badgeBox.textContent=unlocked?'READY':'LOCKED';badgeBox.classList.toggle('unlocked',unlocked);unlockText.textContent=unlocked?'Checkpoint unlocked. Clear the review to earn this stage badge.':'Score at least 6/8 in all six themes to unlock this checkpoint.';startBtn.disabled=!unlocked;if(unlocked){let arr=await Promise.all([...Array(6)].map((_,k)=>getTheme(start+k)));pool=arr.flatMap(t=>t.words.map(w=>({...w,theme:t.id})))}}function renderQ(){if(idx>=questions.length)return finish();let q=questions[idx];reviewArea.innerHTML=`<div class="review-run"><div class="review-progress">Question ${idx+1} / 12 · Score ${score}</div><div class="prompt">${esc(q.definition)}</div><div class="pattern">${q.word[0]} ${'_ '.repeat(Math.max(0,q.word.length-1)).trim()}</div><div class="row"><input id="answer" autocomplete="off" spellcheck="false"><button class="btn" id="submit">Submit</button></div><div id="feedback"></div></div>`;function go(){let ok=norm(answer.value)===norm(q.word);if(ok){score++;good();toast('Correct!')}else{bad();toast('Keep going!',true)}idx++;setTimeout(renderQ,350)}submit.onclick=go;answer.onkeydown=e=>{if(e.key==='Enter')go()};answer.focus()}function finish(){let d=load(),p=d.profiles[d.active];p.reviews=p.reviews||{};let old=p.reviews[stage]?.best||0;p.reviews[stage]={best:Math.max(old,score),last:score,date:new Date().toISOString(),earned:score>=9};save(d);reviewArea.innerHTML=`<div class="reward-panel"><h2>${score>=9?'Checkpoint Badge Earned':'Review Complete'}</h2><div class="reward-score">${score} / 12</div><p>${score>=9?'Badge unlocked. Strong work across six themes.':'Score 9/12 or above to earn the checkpoint badge.'}</p><button class="btn" onclick="location.reload()">Try Again</button></div>`;if(score>=9){good();confetti();toast('Badge unlocked!')}else bad();init()}startBtn.onclick=()=>{questions=shuffle(pool).slice(0,12);idx=0;score=0;renderQ()};sound.onclick=function(){soundOn=!soundOn;this.textContent='Sound: '+(soundOn?'ON':'OFF')};init();</script></body></html>
