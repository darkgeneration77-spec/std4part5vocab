<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate — Word Scoop</title><link rel="stylesheet" href="style.css?v=20260829k"><style>body{background:#eee}.cert-actions{max-width:1120px;margin:18px auto;display:flex;gap:10px;flex-wrap:wrap;padding:0 16px}.certificate{width:min(1120px,calc(100% - 30px));min-height:760px;margin:20px auto;background:#fffaf0;border:14px double #542f1f;padding:55px;position:relative;text-align:center;box-shadow:0 15px 45px #0002}.cert-kicker{font-weight:1000;letter-spacing:.22em;color:#7a4a2e}.certificate h1{font-family:Georgia,serif;font-size:58px;margin:25px 0 10px;color:#542f1f;letter-spacing:0}.cert-present{font-size:18px}.cert-name{font-family:Georgia,serif;font-size:48px;border-bottom:2px solid #542f1f;display:inline-block;min-width:65%;padding:12px 30px;color:#542f1f}.cert-text{max-width:760px;margin:25px auto;font-size:21px;line-height:1.65}.cert-score{font-size:28px;font-weight:1000;background:#ffc928;border:3px solid #542f1f;border-radius:999px;display:inline-block;padding:12px 25px}.cert-footer{display:flex;justify-content:space-between;gap:30px;margin-top:70px}.sig{width:260px;border-top:2px solid #542f1f;padding-top:8px;font-weight:900}.cert-seal{width:105px;height:105px;border:6px double #542f1f;border-radius:50%;display:grid;place-items:center;margin:28px auto 0;font-weight:1000;transform:rotate(-8deg);background:#ffe38a}.locked-cert{max-width:760px;margin:70px auto;background:#fff;padding:30px;border:3px solid #542f1f;border-radius:24px;text-align:center}@media print{body{background:white}.cert-actions,.locked-cert{display:none}.certificate{box-shadow:none;margin:0;width:100%;min-height:100vh;border-width:10px;page-break-inside:avoid}@page{size:A4 landscape;margin:8mm}}@media(max-width:700px){.certificate{padding:28px 18px;min-height:650px}.certificate h1{font-size:38px}.cert-name{font-size:34px;min-width:90%}.cert-footer{margin-top:45px}.sig{width:45%}}</style></head><body><div class="cert-actions" id="actions"><a class="btn" href="index.html">Back to Learning</a><button class="btn" id="printBtn">Print / Save as PDF</button></div><div id="app"></div><script>const KEY='wordscoop_v3';function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function grade(n){let p=n/192*100;return p>=90?'Outstanding Achievement':p>=80?'Excellent Achievement':p>=70?'Strong Achievement':p>=60?'Successful Completion':'Course Completion'}let d=load(),p=d?.profiles?.[d.active],done=(p?.final?.round||0)>=8;if(!done){app.innerHTML='<section class="locked-cert"><h1>Certificate Locked</h1><p>Complete all 8 rounds of the Final 192 Words Challenge to unlock the certificate.</p><a class="btn" href="final.html">Go to Final Challenge</a></section>';actions.style.display='none'}else{let score=p.final.total||0,date=p.final.completedDate?new Date(p.final.completedDate):new Date(),dateText=date.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});app.innerHTML=`<article class="certificate"><div class="cert-kicker">WORD SCOOP</div><h1>Certificate of Achievement</h1><p class="cert-present">This certificate is proudly presented to</p><div class="cert-name">${esc(d.active)}</div><p class="cert-text">for successfully completing the <b>Year 4 English Spelling & Vocabulary Programme</b>, covering <b>24 learning themes and 192 target words</b>, including all checkpoint reviews and the Final 192 Words Challenge.</p><div class="cert-score">${grade(score)} · Final Score ${score} / 192</div><div class="cert-seal">192<br>WORDS</div><div class="cert-footer"><div class="sig">${dateText}<br><small>Date of Completion</small></div><div class="sig">WORD SCOOP<br><small>Learning Programme</small></div></div></article>`}printBtn?.addEventListener('click',()=>window.print());</script></body></html>
