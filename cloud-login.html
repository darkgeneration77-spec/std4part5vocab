<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Login — Word Scoop</title><link rel="stylesheet" href="style.css?v=20260830a"><style>.cloud-shell{max-width:650px;margin:40px auto;padding:20px}.cloud-card{background:#fffdf6;border:3px solid #542f1f;border-radius:24px;padding:24px;box-shadow:8px 8px 0 rgba(84,47,31,.12)}.cloud-card h1{color:#542f1f}.cloud-card input{width:100%;box-sizing:border-box;padding:14px 16px;font-size:20px;border:3px solid #542f1f;border-radius:14px;text-transform:uppercase;margin:12px 0}.cloud-status{margin-top:14px;font-weight:800;color:#7a4a2e}.cloud-note{font-size:14px;color:#7a4a2e;line-height:1.5}.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1;min-width:180px}</style></head><body><header><div class="wrap"><span class="brand">WORD SCOOP</span><h1>Cloud Student Login</h1><p>Continue your progress on this device.</p></div></header><div class="cloud-shell"><section class="cloud-card"><h2>Enter Student ID</h2><p class="cloud-note">Use the Student ID shown in Teacher Dashboard, for example <b>WS-123456</b>.</p><input id="studentIdInput" placeholder="WS-123456" maxlength="9" autocomplete="off"><div class="row2"><button class="btn" id="loginBtn">Load My Progress</button><a class="btn" href="index.html">Back</a></div><div class="cloud-status" id="statusText"></div></section></div><script src="cloud-sync.js?v=20260831a"></script><script>loginBtn.onclick=async()=>{let id=studentIdInput.value.trim().toUpperCase();statusText.textContent='Loading cloud progress...';try{let name=await WordScoopCloud.loginById(id);statusText.textContent='Loaded '+name+'. Opening Word Scoop...';setTimeout(()=>location.href='index.html',500)}catch(e){statusText.textContent=e.message||'Could not load this Student ID.'}};studentIdInput.onkeydown=e=>{if(e.key==='Enter')loginBtn.click()};</script></body></html>
