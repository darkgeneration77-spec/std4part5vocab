<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Login — Word Scoop</title><link rel="stylesheet" href="style.css?v=20260831g"><style>.cloud-shell{max-width:650px;margin:40px auto;padding:20px}.cloud-card{background:#fffdf6;border:3px solid #542f1f;border-radius:24px;padding:24px;box-shadow:8px 8px 0 rgba(84,47,31,.12)}.cloud-card h1{color:#542f1f}.cloud-card input{width:100%;box-sizing:border-box;padding:14px 16px;font-size:20px;border:3px solid #542f1f;border-radius:14px;margin:12px 0}.cloud-card #studentIdInput{text-transform:uppercase}.cloud-status{margin-top:14px;font-weight:800;color:#7a4a2e}.cloud-note{font-size:14px;color:#7a4a2e;line-height:1.5}.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1;min-width:180px}.pin-label{display:block;margin-top:10px;font-weight:900;color:#542f1f}</style></head><body><header><div class="wrap"><span class="brand">WORD SCOOP</span><h1>Cloud Student Login</h1><p>Continue your progress securely on this device.</p></div></header><div class="cloud-shell"><section class="cloud-card"><h2>Student ID + PIN</h2><p class="cloud-note">Enter the Student ID shown in Teacher Dashboard. If this is the first PIN login for an older account, the 4-digit PIN you enter will become that account's PIN.</p><label class="pin-label" for="studentIdInput">Student ID</label><input id="studentIdInput" placeholder="WS-123456" maxlength="9" autocomplete="username"><label class="pin-label" for="pinInput">4-digit PIN</label><input id="pinInput" placeholder="1234" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" type="password"><div class="row2"><button class="btn" id="loginBtn">Load My Progress</button><a class="btn" href="index.html">Back</a></div><div class="cloud-status" id="statusText"></div></section></div><script src="cloud-sync.js?v=20260831g"></script><script>loginBtn.onclick=async()=>{let id=studentIdInput.value.trim().toUpperCase(),pin=pinInput.value.trim();statusText.textContent='Checking Student ID and PIN...';try{let name=await WordScoopCloud.loginById(id,pin);statusText.textContent='Loaded '+name+'. Opening Word Scoop...';setTimeout(()=>location.href='index.html',500)}catch(e){statusText.textContent=e.message||'Could not load this account.'}};studentIdInput.onkeydown=e=>{if(e.key==='Enter')pinInput.focus()};pinInput.oninput=()=>{pinInput.value=pinInput.value.replace(/\D/g,'').slice(0,4)};pinInput.onkeydown=e=>{if(e.key==='Enter')loginBtn.click()};</script></body></html>
