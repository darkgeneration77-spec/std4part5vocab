<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final 192 Words Challenge — Word Scoop</title><link rel="stylesheet" href="style.css?v=20260831c"><link rel="stylesheet" href="checkpoint.css?v=20260831c"></head><body><header><div class="wrap"><span class="brand">WORD SCOOP</span><h1>Final 192 Words Challenge</h1><p>8 rounds · 24 words each · all 192 words</p></div></header><main><nav class="nav"><a href="index.html">All Themes</a><a href="home.html">My Home</a></nav><section class="checkpoint-card"><div class="checkpoint-head"><div><b id="studentName"></b><h2>Master Challenge</h2></div><div class="badge-big final-badge" id="finalBadge">FINAL</div></div><p id="unlockText"></p><div class="dashboard"><div class="stat">Rounds cleared<b id="roundsDone">0 / 8</b></div><div class="stat">Best total<b id="bestTotal">0 / 192</b></div><div class="stat">Current round<b id="roundLabel">1 / 8</b></div><div class="stat">Round score<b id="roundScore">0 / 24</b></div></div><button class="btn" id="startBtn">Start / Continue Final</button><button class="btn" id="resetFinal">Reset Final Progress</button><div id="finalArea"></div></section></main><div class="toast"></div><button class="btn sound" id="sound">Sound: ON</button><script src="cloud-sync.js?v=20260831c"></script><script>const KEY='wordscoop_v3';let soundOn=true,ac=null,pool=[],roundWords=[],q=0,roundCorrect=0;function load(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}return d||{active:'Student',profiles:{Student:{themes:{},wrong:{},mastery:{},attempts:[]}}}}function save(d){localStorage.setItem(KEY,JSON.stringify(d))}function sync(){if(window.WordScoopCloud?.syncActive)setTimeout(()=>window.WordScoopCloud.syncActive(),50)}function norm(s){return(s||'').trim().toLowerCase().replace(/\s+/g,' ')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function pattern(w){return[...w].map((c,i)=>/[a-z]/i.test(c)?(i===0?c:'_'):c).join(' ')}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function tone(f,d=.13,z=0){if(!soundOn)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!ac)ac=new A();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.13;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+z);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+z+d);o.stop(ac.currentTime+z+d+.02)}function good(){tone(523);tone(659,.14,.08);tone(784,.17,.16)}function bad(){tone(220);tone(196,.17,.1)}function toast(t,e=false){let x=document.querySelector('.toast');x.textContent=t;x.className='toast'+(e?' err':'');void x.offsetWidth;x.classList.add('show')}async function getTheme(n){let txt=await fetch(`data-${String(n).padStart(2,'0')}.js?v=20260831c`).then(r=>r.text()),box={};new Function('window',txt)(box);return box.THEME}function finalEarned(f){return !!(f?.earned||f?.completedDate||(f?.round||0)>=8)}async function init(){let d=load(),p=d.profiles[d.active];studentName.textContent='Student: '+d.active;p.reviews=p.reviews||{};let badges=[1,2,3,4].filter(s=>p.reviews[s]?.earned).length,unlocked=badges===4;unlockText.textContent=unlocked?'All four checkpoint badges earned. Final challenge unlocked.':'Earn all four checkpoint badges to unlock the Final 192 Words Challenge.';startBtn.disabled=!unlocked;p.final=p.final||{round:0,total:0,bestTotal:0};if(finalEarned(p.final)&&!p.final.earned){p.final.earned=true;save(d)}roundsDone.textContent=(p.final.round||0)+' / 8';bestTotal.textContent=(p.final.bestTotal||0)+' / 192';roundLabel.textContent=Math.min(8,(p.final.round||0)+1)+' / 8';roundScore.textContent='0 / 24';if(unlocked){let arr=await Promise.all([...Array(24)].map((_,k)=>getTheme(k+1)));pool=arr.flatMap(t=>t.words.map(w=>({...w,theme:t.id})));finalBadge.classList.add('unlocked')}}function nextQ(){if(q>=roundWords.length)return finishRound();let w=roundWords[q];finalArea.innerHTML=`<div class="review-run"><div class="review-progress">Round question ${q+1} / 24</div><div class="prompt">${esc(w.definition)}</div><div class="pattern">${pattern(w.word)}</div><div class="row"><input id="answer" autocomplete="off" spellcheck="false"><button class="btn" id="submit">Submit</button></div></div>`;function go(){let ok=norm(answer.value)===norm(w.word);if(ok){roundCorrect++;good();toast('Correct!')}else{bad();toast('Keep going!',true)}roundScore.textContent=roundCorrect+' / 24';q++;setTimeout(nextQ,300)}submit.onclick=go;answer.onkeydown=e=>{if(e.key==='Enter')go()};answer.focus()}function startRound(){let d=load(),p=d.profiles[d.active];p.final=p.final||{round:0,total:0,bestTotal:0};let r=p.final.round||0;if(r>=8)return showComplete();if(!Array.isArray(p.final.order)||p.final.order.length!==pool.length){p.final.order=shuffle([...Array(pool.length).keys()]);save(d);sync()}roundWords=p.final.order.slice(r*24,r*24+24).map(i=>pool[i]);q=0;roundCorrect=0;nextQ()}function finishRound(){let d=load(),p=d.profiles[d.active];p.final=p.final||{round:0,total:0,bestTotal:0};p.final.total=(p.final.total||0)+roundCorrect;p.final.round=(p.final.round||0)+1;if(p.final.round>=8){p.final.bestTotal=Math.max(p.final.bestTotal||0,p.final.total);p.final.earned=true;p.final.completedDate=p.final.completedDate||new Date().toISOString()}save(d);sync();finalArea.innerHTML=`<div class="reward-panel"><h2>Round ${p.final.round} Complete</h2><div class="reward-score">${roundCorrect} / 24</div><button class="btn" onclick="location.reload()">Continue</button></div>`;good()}function showComplete(){let d=load(),p=d.profiles[d.active];finalArea.innerHTML=`<div class="reward-panel certificate-unlock"><h2>192 Words Challenge Complete</h2><div class="reward-score">${p.final.total||0} / 192</div><p>Best total: ${p.final.bestTotal||0} / 192</p><p><b>Certificate of Achievement unlocked.</b></p><a class="btn" href="certificate.html">View Certificate</a></div>`}startBtn.onclick=startRound;resetFinal.onclick=()=>{if(!confirm('Reset this student’s Final Challenge progress? Earned certificate and Final reward will be kept.'))return;let d=load(),p=d.profiles[d.active],old=p.final||{};p.final={round:0,total:0,bestTotal:old.bestTotal||0,earned:finalEarned(old),completedDate:old.completedDate||null};save(d);sync();setTimeout(()=>location.reload(),250)};sound.onclick=function(){soundOn=!soundOn;this.textContent='Sound: '+(soundOn?'ON':'OFF')};init();</script></body></html>
