<style>
.home-shell{max-width:1180px;margin:auto;padding:24px 18px 60px}.home-top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.wallet{background:#542f1f;color:#fff7df;border:3px solid #542f1f;border-radius:999px;padding:12px 18px;font-weight:1000;font-size:20px}.wallet b{color:#ffc928;font-size:28px}.house-card{background:#fffdf6;border:3px solid #542f1f;border-radius:28px;padding:18px;box-shadow:8px 8px 0 rgba(84,47,31,.14)}.house-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.house-title{font-size:34px;font-weight:1000;color:#542f1f}.scene{height:430px;position:relative;overflow:hidden;border:4px solid #542f1f;border-radius:24px;margin-top:14px;background:#d9d0c7}.scene.level-0{background:linear-gradient(#777 0 65%,#54483f 65%)}.scene.level-1{background:linear-gradient(#f5deb3 0 66%,#b6804f 66%)}.scene.level-2{background:linear-gradient(#dcebf7 0 66%,#b99c7c 66%)}.scene.level-3{background:linear-gradient(#fff0c9 0 66%,#b77e51 66%)}.scene.level-4{background:linear-gradient(#f8e6ea 0 66%,#bb8c62 66%)}.scene.level-5{background:linear-gradient(#e9e0ff 0 66%,#8e6e53 66%)}.window{position:absolute;right:48px;top:45px;width:150px;height:120px;border:10px solid #fff8df;background:linear-gradient(#9ed5ff 0 70%,#93c67a 70%);box-shadow:0 0 0 4px #542f1f}.window:before,.window:after{content:"";position:absolute;background:#542f1f}.window:before{width:6px;height:100%;left:50%;top:0}.window:after{height:6px;width:100%;top:50%;left:0}.door{position:absolute;left:40px;bottom:0;width:105px;height:200px;background:#8d5a3d;border:5px solid #542f1f;border-bottom:0;border-radius:10px 10px 0 0}.door:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#ffc928;right:12px;top:90px;border:2px solid #542f1f}.item{display:none;position:absolute;z-index:3}.item.show{display:block}.rug{left:34%;bottom:18px;width:240px;height:70px;background:#d99e73;border:4px solid #542f1f;border-radius:50%}.lamp{left:190px;bottom:74px;width:55px;height:160px;border-left:8px solid #542f1f}.lamp:before{content:"";position:absolute;left:-31px;top:0;width:62px;height:48px;background:#ffc928;border:4px solid #542f1f;border-radius:30px 30px 12px 12px}.lamp:after{content:"";position:absolute;left:-24px;bottom:-5px;width:48px;height:12px;background:#542f1f;border-radius:50%}.desk{left:255px;bottom:62px;width:165px;height:85px;border-top:16px solid #7a4a2e;border-left:12px solid #542f1f;border-right:12px solid #542f1f}.sofa{right:190px;bottom:64px;width:220px;height:105px;background:#cfe8cf;border:5px solid #542f1f;border-radius:30px 30px 12px 12px}.sofa:before,.sofa:after{content:"";position:absolute;bottom:-28px;width:18px;height:30px;background:#542f1f}.sofa:before{left:28px}.sofa:after{right:28px}.bookshelf{left:170px;top:95px;width:120px;height:175px;background:#9b6947;border:5px solid #542f1f}.bookshelf:before{content:"";position:absolute;left:8px;right:8px;top:42px;height:5px;background:#542f1f;box-shadow:0 48px 0 #542f1f,0 96px 0 #542f1f}.tv{right:55px;bottom:75px;width:130px;height:90px;background:#282828;border:6px solid #542f1f;border-radius:10px}.tv:before{content:"";position:absolute;left:22px;right:22px;top:18px;bottom:18px;background:#83b8d9}.tv:after{content:"";position:absolute;left:50%;bottom:-28px;width:12px;height:25px;background:#542f1f;transform:translateX(-50%)}.plant{right:210px;top:150px;width:65px;height:90px;background:#a96842;border:4px solid #542f1f;border-radius:8px 8px 20px 20px}.plant:before{content:"";position:absolute;width:75px;height:85px;left:-9px;top:-65px;background:#78ad67;border:4px solid #542f1f;border-radius:50%}.petbed{left:52%;bottom:55px;width:110px;height:48px;background:#f3c4c7;border:5px solid #542f1f;border-radius:50%}.garden{right:12px;top:12px;width:145px;height:65px;border:4px solid #542f1f;background:#8bc77a;border-radius:14px}.garden:after{content:"GARDEN";position:absolute;inset:0;display:grid;place-items:center;font-weight:1000;color:#542f1f}.shop{margin-top:22px}.shop h2{color:#542f1f}.shop-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px}.shop-item{background:#fffdf6;border:2px solid #542f1f;border-radius:18px;padding:14px}.shop-item b{display:block;font-size:18px;color:#542f1f}.price{font-weight:1000;color:#7a4a2e;margin:8px 0}.shop-item button{width:100%}.shop-item.owned{background:#cfe8cf}.levels{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px;margin-top:12px}.level-card{background:#fff8df;border:2px solid #542f1f;border-radius:18px;padding:14px}.level-card.current{background:#ffc928}.level-card.locked{opacity:.62}.note{font-size:13px;color:#7a4a2e;font-weight:700}@media(max-width:800px){.shop-grid,.levels{grid-template-columns:repeat(2,1fr)}.scene{height:360px}.window{right:20px;transform:scale(.8);transform-origin:top right}.sofa{right:35px;transform:scale(.75);transform-origin:bottom right}.desk{left:155px;transform:scale(.75);transform-origin:bottom left}.bookshelf{left:135px;transform:scale(.7);transform-origin:top left}.lamp{left:150px;transform:scale(.75);transform-origin:bottom left}}@media(max-width:520px){.shop-grid,.levels{grid-template-columns:1fr}.scene{height:330px}.door{width:80px;height:170px}.rug{left:25%;width:170px}.desk{display:none!important}.bookshelf{display:none!important}.plant{display:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">WORD SCOOP</span><h1>My Home</h1><p>Learn words. Earn Coins. Build your place.</p></div></header>
<div class="home-shell"><div class="home-top"><div><a class="btn" href="index.html">Back to Themes</a></div><div class="wallet">Coins: <b id="coins">0</b></div></div><section class="house-card"><div class="house-head"><div><div class="note" id="studentName"></div><div class="house-title" id="houseName">Cave</div></div><div><b id="earnedText"></b><div class="note">10 Coins per correct answer · +50 for 8/8</div></div></div><div class="scene level-0" id="scene"><div class="door"></div><div class="window"></div><div class="item rug" data-item="rug"></div><div class="item lamp" data-item="lamp"></div><div class="item desk" data-item="desk"></div><div class="item sofa" data-item="sofa"></div><div class="item bookshelf" data-item="bookshelf"></div><div class="item tv" data-item="tv"></div><div class="item plant" data-item="plant"></div><div class="item petbed" data-item="petbed"></div><div class="item garden" data-item="garden"></div></div></section><section class="shop"><h2>Upgrade Your Home</h2><div class="levels" id="levels"></div></section><section class="shop"><h2>Furniture Shop</h2><div class="shop-grid" id="shopGrid"></div></section></div>
<script>const KEY='wordscoop_v3';const houses=[{name:'Cave',cost:0},{name:'Little Cabin',cost:600},{name:'Apartment',cost:1200},{name:'Double-Storey House',cost:2200},{name:'Mansion',cost:4000},{name:'Castle',cost:6500}];const items=[{id:'rug',name:'Rug',cost:100},{id:'lamp',name:'Lamp',cost:150},{id:'desk',name:'Study Desk',cost:200},{id:'sofa',name:'Sofa',cost:250},{id:'bookshelf',name:'Bookshelf',cost:300},{id:'tv',name:'TV',cost:400},{id:'plant',name:'Plant',cost:450},{id:'petbed',name:'Pet Bed',cost:500},{id:'garden',name:'Mini Garden',cost:800}];function load(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!d)d={active:'Student',profiles:{Student:{themes:{},wrong:{},mastery:{},attempts:[]}}};d.profiles=d.profiles||{};d.active=d.active||'Student';d.profiles[d.active]=d.profiles[d.active]||{themes:{},wrong:{},mastery:{},attempts:[]};return d}function save(d){localStorage.setItem(KEY,JSON.stringify(d))}function earnedCoins(p){let attempts=p.attempts||[],base=attempts.reduce((n,a)=>n+(Number(a.score)||0)*10+((Number(a.score)||0)===8?50:0),0);let badgeBonus=Object.values(p.reviews||{}).filter(x=>x&&x.earned).length*200;let finalBonus=(p.final?.round||0)>=8?1000:0;return base+badgeBonus+finalBonus}function ensureHome(p){p.home=p.home||{spent:0,owned:[],level:0};p.home.owned=p.home.owned||[];p.home.spent=Number(p.home.spent)||0;p.home.level=Number(p.home.level)||0}function balance(p){return Math.max(0,earnedCoins(p)-p.home.spent)}function paint(){let d=load(),p=d.profiles[d.active];ensureHome(p);save(d);studentName.textContent='Student: '+d.active;let earned=earnedCoins(p),bal=balance(p);coins.textContent=bal.toLocaleString();earnedText.textContent='Total earned: '+earned.toLocaleString()+' Coins';houseName.textContent=houses[p.home.level]?.name||houses[0].name;scene.className='scene level-'+p.home.level;document.querySelectorAll('[data-item]').forEach(el=>el.classList.toggle('show',p.home.owned.includes(el.dataset.item)));levels.innerHTML=houses.map((h,i)=>{let current=i===p.home.level,next=i===p.home.level+1,past=i<p.home.level;let cls='level-card'+(current?' current':'')+(!current&&!next&&!past?' locked':'');let text=current?'Current Home':past?'Owned':next?'Upgrade · '+h.cost+' Coins':'Locked';return `<div class="${cls}"><b>${h.name}</b><div class="price">${i===0?'Starter':h.cost+' Coins'}</div><button class="btn upgrade" data-level="${i}" ${next?'':'disabled'}>${text}</button></div>`}).join('');shopGrid.innerHTML=items.map(it=>{let owned=p.home.owned.includes(it.id),can=bal>=it.cost;return `<div class="shop-item ${owned?'owned':''}"><b>${it.name}</b><div class="price">${it.cost} Coins</div><button class="btn buy" data-id="${it.id}" ${owned||!can?'disabled':''}>${owned?'Owned':can?'Buy':'Need more Coins'}</button></div>`}).join('');document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>buyItem(b.dataset.id));document.querySelectorAll('.upgrade').forEach(b=>b.onclick=()=>upgrade(Number(b.dataset.level)))}function buyItem(id){let d=load(),p=d.profiles[d.active];ensureHome(p);let it=items.find(x=>x.id===id);if(!it||p.home.owned.includes(id)||balance(p)<it.cost)return;p.home.spent+=it.cost;p.home.owned.push(id);save(d);paint()}function upgrade(level){let d=load(),p=d.profiles[d.active];ensureHome(p);if(level!==p.home.level+1)return;let h=houses[level];if(!h||balance(p)<h.cost)return;p.home.spent+=h.cost;p.home.level=level;save(d);paint()}paint();</script>
</body></html>
